<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - Gestion des déchets</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}
header {
    background: #166534;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}
.box {
    background: white;
    padding: 18px;
    margin-top: 20px;
    border-radius: 10px;
}
input, button, select {
    padding: 12px;
    margin: 6px 0;
    width: 100%;
    box-sizing: border-box;
}
button {
    background: #166534;
    color: white;
    border: none;
    border-radius: 6px;
}
.signalement {
    background: #f8fafc;
    padding: 15px;
    margin: 12px 0;
    border-left: 4px solid #166534;
    border-radius: 6px;
    overflow-wrap: anywhere;
}
.hidden { display: none; }
</style>
</head>

<body>

<header>
<h2>Administration</h2>
<p>Gestion des déchets - Ville de Kolwezi</p>
</header>

<div class="box" id="connexion">
<h3>Connexion administrateur</h3>
<input type="email" id="email" placeholder="Adresse e-mail">
<input type="password" id="password" placeholder="Mot de passe">
<button id="login">Se connecter</button>
<p id="message"></p>
</div>

<div class="box hidden" id="dashboard">
<h3>Tableau de bord</h3>
<p>Signalements reçus : <strong id="total">0</strong></p>
<button id="logout">Se déconnecter</button>
<div id="liste"></div>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getFirestore, collection, onSnapshot, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
getAuth, signInWithEmailAndPassword,
onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAneFEp21EDIc-BA9FVmDBjdlMhfJwN8",
authDomain: "gestion-dechets-kolwezi.firebaseapp.com",
projectId: "gestion-dechets-kolwezi",
storageBucket: "gestion-dechets-kolwezi.firebasestorage.app",
messagingSenderId: "447410695169",
appId: "1:447410695169:web:279c5506d952edcb5a6400",
measurementId: "G-DTB6PZPCKT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const connexion = document.getElementById("connexion");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("login").onclick = async () => {
    message.textContent = "Connexion en cours...";

    try {
        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value,
            document.getElementById("password").value
        );
    } catch (error) {
    message.textContent = "Erreur technique : " + error.code;
}
};

onAuthStateChanged(auth, (user) => {
    if (user) {
        connexion.classList.add("hidden");
        dashboard.classList.remove("hidden");
        afficherSignalements();
    } else {
        connexion.classList.remove("hidden");
        dashboard.classList.add("hidden");
    }
});

document.getElementById("logout").onclick = () => signOut(auth);

let unsubscribe = null;

function afficherSignalements() {
    if (unsubscribe) unsubscribe();

    const liste = document.getElementById("liste");

    unsubscribe = onSnapshot(
        collection(db, "signalements"),
        (snapshot) => {
            document.getElementById("total").textContent = snapshot.size;

            liste.innerHTML = "";

            if (snapshot.empty) {
                liste.textContent = "Aucun signalement reçu.";
                return;
            }

            snapshot.forEach((document) => {
                const data = document.data();
                const id = document.id;

                const bloc = document.createElement("div");
                bloc.className = "signalement";

                const titre = document.createElement("h3");
                titre.textContent = data.type || "Type non précisé";

                const description = document.createElement("p");
                description.textContent = data.description || "Aucune description";

                const date = document.createElement("p");
                date.textContent = "Date : " + (data.date || "Non précisée");

                const position = document.createElement("p");
                position.textContent =
                    "Latitude : " + data.latitude +
                    " | Longitude : " + data.longitude;

                const statut = document.createElement("p");
                statut.textContent = "Statut : " + (data.statut || "Non précisé");

                const choix = document.createElement("select");

                ["En attente", "En cours", "Résolu"].forEach((etat) => {
                    const option = document.createElement("option");
                    option.value = etat;
                    option.textContent = etat;
                    if (data.statut === etat) option.selected = true;
                    choix.appendChild(option);
                });

                const bouton = document.createElement("button");
                bouton.textContent = "Mettre à jour le statut";

                bouton.onclick = async () => {
                    try {
                        await updateDoc(doc(db, "signalements", id), {
                            statut: choix.value
                        });
                        alert("Statut mis à jour !");
                    } catch (error) {
                        alert("Erreur lors de la mise à jour.");
                    }
                };

                bloc.append(
                    titre, description, date, position, statut, choix, bouton
                );

                liste.appendChild(bloc);
            });
        },
        (error) => {
            liste.textContent = "Impossible de charger les signalements.";
        }
    );
}
</script>

</body>
  </html>
